name: Check site and lead delivery
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Hugo with checksum verification
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat .hugo-version)"
          archive="hugo_extended_${version}_linux-amd64.tar.gz"
          url="https://github.com/gohugoio/hugo/releases/download/v${version}"
          curl -fsSL "$url/$archive" -o "$RUNNER_TEMP/$archive"
          curl -fsSL "$url/hugo_${version}_checksums.txt" -o "$RUNNER_TEMP/hugo-checksums.txt"
          (cd "$RUNNER_TEMP" && grep " $archive$" hugo-checksums.txt | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" hugo
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: hugo --environment production --destination "$RUNNER_TEMP/site"
      - run: python3 scripts/check_site.py "$RUNNER_TEMP/site"
      - run: node --check assets/js/app.js
      - run: node --test tests/frontend.test.cjs
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/worker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/worker/package-lock.json
      - run: npm ci
      - run: npm run check
        env:
          WRANGLER_SEND_METRICS: 'false'
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 -m unittest discover -s tests -v
        working-directory: services/relay
      - run: bash -n scripts/deploy_relay.sh
