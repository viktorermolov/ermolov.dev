<footer class="site-footer">
  <div class="wrap footer-inner">
    <a class="brand" href="/" aria-label="{{ .Site.Params.brand }}, home">{{ partial "brand-mark.html" . }}<span class="brand-name">{{ .Site.Params.brand }}</span></a>
    <nav class="footer-links" aria-label="Footer"><a href="mailto:{{ .Site.Params.contact.email }}">Email</a><a href="{{ .Site.Params.contact.github }}" rel="me">GitHub</a><a href="{{ .Site.Params.contact.linkedin }}" rel="me">LinkedIn</a>{{ if where site.RegularPages "Section" "notes" }}<a href="/notes/">Notes</a>{{ end }}<a href="/clipstay/privacy/">Clipstay privacy</a></nav>
    <p class="footer-copyright">© {{ now.Year }} {{ .Site.Params.author }}</p>
  </div>
</footer>
