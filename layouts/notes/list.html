{{ define "main" }}
  <section class="page" aria-labelledby="notes-index-title">
    <div class="wrap">
      <header class="page-head"><h1 id="notes-index-title" class="page-title">Engineering notes</h1><p class="page-lede">{{ .Description }}</p></header>
      <ol class="note-list">
        {{- range .Pages.ByWeight }}
        <li><a href="{{ .RelPermalink }}"><h2>{{ .Title }}</h2><p>{{ .Description }}</p></a></li>
        {{- end }}
      </ol>
    </div>
  </section>
{{ end }}
