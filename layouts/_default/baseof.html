<!DOCTYPE html>
<html lang="{{ or .Site.Language.Lang "en" }}">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main content</a>
    {{ partial "header.html" . }}
    <main id="main" class="site-main">
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
    {{- $js := resources.Get "js/app.js" -}}
    {{- if hugo.IsProduction -}}
      {{- $js = $js | minify | fingerprint -}}
    {{- end -}}
    <script src="{{ $js.RelPermalink }}"{{ with $js.Data.Integrity }} integrity="{{ . }}"{{ end }} defer></script>
  </body>
</html>
