{{ define "main" }}
  <article class="page article" aria-labelledby="legal-title">
    <div class="wrap article__layout">
      <header class="article__header">
        <h1 id="legal-title" class="page-title">{{ .Title }}</h1>
        <p class="article__lede">{{ .Description }}</p>
        <p class="article__meta">Last updated <time datetime="{{ .Lastmod.Format "2006-01-02" }}">{{ .Lastmod.Format "January 2, 2006" }}</time></p>
      </header>
      <div class="prose">
        {{ .Content }}
      </div>
    </div>
  </article>
{{ end }}
