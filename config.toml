  favicon = "img/favicon.ico"
  ogImage = "og/og-default.png"
  ogImageAlt = "Viktor E. Small products that keep working."
  defaultTheme = "light"
  accentColor = "#1d4fe0"
  themeColorLight = "#f6f8fe"
  themeColorDark = "#081230"
  analyticsToken = "99147b109be9494d85d44b60d9b075a4"
  twitterHandle = "@viktor__ermolov"

  [params.contact]
    email = "viktor@ermolov.dev"
